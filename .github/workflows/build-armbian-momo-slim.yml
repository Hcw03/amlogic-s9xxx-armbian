name: Build Armbian momo slim

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      armbian_board:
        description: "Target board family"
        required: true
        default: "s905l3a"
        type: choice
        options:
          - s905l3a
          - s905l3b
      armbian_kernel:
        description: "Kernel version (L3A: 6.12.114 / L3B: 6.18.63)"
        required: true
        default: "6.12.114"

env:
  REPO_URL: https://github.com/armbian/build
  REPO_BRANCH: main
  BOARD: odroidn2
  RELEASE: bookworm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup QEMU binfmt (ARM64 emulation for cross-build)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build Armbian rootfs
        run: |
          git clone --depth 1 ${REPO_URL} -b ${REPO_BRANCH}
          cd build/
          ./compile.sh RELEASE=${RELEASE} BOARD=${BOARD} BRANCH=current BUILD_MINIMAL=no \
                        BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                        COMPRESS_OUTPUTIMAGE="sha,gzi" SHARE_LOG=yes

      - name: Rebuild Armbian
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          armbian_files: files
          armbian_fstype: ext4
          armbian_edition: server
          builder_name: momo
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/*.img.gz"
          allowUpdates: true
          tag: Armbian_momo_slim_${{ inputs.armbian_board }}_${{ inputs.armbian_kernel }}
          token: ${{ secrets.GITHUB_TOKEN }}
